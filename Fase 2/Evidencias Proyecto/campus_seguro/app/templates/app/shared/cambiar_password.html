{% extends 'app/base.html' %}
{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="topbar">
  <div>
    <div class="page-title">Cambiar contraseña</div>
    <div class="page-subtitle">Actualiza tu acceso con una nueva clave segura</div>
  </div>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <label>Contraseña actual<input type="password" name="actual" required></label>
      <label>Nueva contraseña<input type="password" name="nueva1" required></label>
      <label>Confirmar nueva contraseña<input type="password" name="nueva2" required></label>
    </div>
    <div style="margin-top:18px;display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a href="{% url 'app:mi_perfil' %}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
